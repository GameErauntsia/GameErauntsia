<div class="steam-panel p-3 mb-3 bg-light border rounded text-center commentform">
    <img class="img-fluid d-block mx-auto mb-2" src="/static/img/steam-logo.png" width="200" height="61" alt="Steam" />
    {% if steam_group %}
    <h2 class="h5 mb-3">{{steam_group.groupName}}</h2>
    <div class="steam-panel-stats row g-2 mb-3">
        <div class="steam-panel-stat col-4 text-muted"><strong class="d-block fs-5 lh-1 mb-1">{{steam_group.memberCount}}</strong><span class="small">Kide</span></div>
        <div class="steam-panel-stat col-4 text-success"><strong class="d-block fs-5 lh-1 mb-1">{{steam_group.membersInGame}}</strong><span class="small">Jolasten</span></div>
        <div class="steam-panel-stat col-4 text-primary"><strong class="d-block fs-5 lh-1 mb-1">{{steam_group.membersOnline}}</strong><span class="small">Online</span></div>
    </div>
    {% else %}
    <p class="text-muted mb-3"><strong>Steam konexioak huts egin du...</strong></p>
    {% endif %}
    <hr class="my-3">
    <a class="steam-group-button" target="_blank" href="https://steamcommunity.com/groups/gamerauntsia">
        <i class="steam-group-icon"></i>
        <span class="steam-group-label">Jarraitu Steam taldea</span>
    </a>
</div>
