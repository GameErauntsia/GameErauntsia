{% load include %}

{% for eran in comments %}
<div class="d-flex mb-3">
    <a class="flex-shrink-0 me-2" href="{% url 'gamer_profile' eran.user.username %}">
        <img class="rounded-circle object-fit-cover" src="{{eran.user.get_photo.get_profilesmall_url}}" alt="{{ eran.name }}" width="40" height="40">
    </a>
    <div class="flex-grow-1" style="min-width: 0;">
        <div class="d-flex flex-wrap align-items-baseline gap-2">
            <a class="small fw-semibold text-break" href="{% url 'gamer_profile' eran.user.username %}">{{ eran.name }}</a>
            <a class="small text-muted text-decoration-none text-break" href="{{eran.get_absolute_url}}">{{ eran.submit_date }}</a>
        </div>
        <div class="small text-break">{{ eran.comment|truncatechars:150 }}</div>
        <a class="nickname d-block small text-break" href="{{eran.get_absolute_url}}">{{eran|get_parent_title|truncatechars:50}}</a>
    </div>
</div>
{% endfor %}
